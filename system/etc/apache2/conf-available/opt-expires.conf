####
#    File: /etc/apache2/conf-available/opt-expires.conf
#    Author: Truc Minh Phan <immersedone>
#    Last Modified: Truc Minh Phan (18/12/2019)
#    Description:
#
#    This file contains the Browser Asset Cache Expiration
#    on the Apache2 level for certain filetypes.
#
#    Dependency: mod_expires.so
#
##

<IfModule mod_expires.c>
    ExpiresActive on
    ExpiresDefault "access plus 30 seconds"
    ExpiresByType text/html "access plus 15 days"
    ExpiresByType image/gif "access plus 1 months"
    ExpiresByType image/jpg "access plus 1 months"
    ExpiresByType image/jpeg "access plus 1 months"
    ExpiresByType image/png "access plus 1 months"
    ExpiresByType text/js "access plus 1 months"
    ExpiresByType text/javascript "access plus 1 months"
    ExpiresByType application/javascript "access plus 1 months"
</IfModule>
